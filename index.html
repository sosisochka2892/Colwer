<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kolwer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
:root{--bg:#E8ECF2;--panel:#FFFFFF;--panel-2:#F1F4F8;--chat-bg:#E3EAF2;--line:#DCE2EA;--ink:#0F1722;--muted:#66758A;--accent:#2A7BF6;--accent-ink:#FFFFFF;--mine-bg:#2A7BF6;--mine-fg:#FFFFFF;--their-bg:#FFFFFF;--their-fg:#0F1722;--font-body:"Golos Text",sans-serif;--font-display:"Unbounded",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#090D13;--panel:#131921;--panel-2:#1A222C;--chat-bg:#0E141B;--line:#243040;--ink:#E8EEF5;--muted:#8A9AAD;--accent:#4C9AFF;--accent-ink:#06162E;--mine-bg:#2563C9;--mine-fg:#F4F8FF;--their-bg:#1C2530;--their-fg:#E8EEF5}}
*,*::before,*::after{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding:12px}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.side{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel)}.main{display:flex;flex-direction:column;min-height:0;min-width:0;background-color:var(--chat-bg)}@media(max-width:759px){body{padding:0}.app{border:0;border-radius:0;grid-template-columns:minmax(0,1fr)}.app.in-chat .side{display:none}.app:not(.in-chat) .main{display:none}}
.side-head{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;min-height:58px}.brand{font-family:var(--font-display);font-weight:700;font-size:20px;flex:1;padding-left:4px}.search{position:relative;margin:4px 14px 8px}.search input{width:100%;padding:10px 12px 10px 38px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:16px}.list{flex:1;min-height:0;overflow-y:auto}.item{display:flex;gap:12px;align-items:center;width:100%;padding:10px 14px;border:0;background:none;text-align:left}.item:hover{background:var(--panel-2)}.item-body{min-width:0;flex:1}.item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.item-bot{display:flex;align-items:center;gap:8px;margin-top:1px}.preview{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.empty{flex:1;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}.conv{flex:1;min-height:0;display:flex;flex-direction:column}.conv-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.conv-who{min-width:0;flex:1;border:0;background:none;text-align:left;padding:0}.conv-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{display:none;border:0;background:none;font-size:22px}@media(max-width:759px){.app.in-chat .back{display:block}}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column}.row{display:flex;gap:8px;align-items:flex-end;margin-top:2px;min-width:0}.row:not(.run){margin-top:10px}.row.mine{justify-content:flex-end}.bubble{max-width:min(78%,560px);min-width:0;padding:8px 12px 6px;border-radius:16px;cursor:pointer;background:var(--their-bg);color:var(--their-fg);box-shadow:0 0 0 1px var(--line);overflow-wrap:anywhere}.mine .bubble{background:var(--mine-bg);color:var(--mine-fg);box-shadow:none;border-bottom-right-radius:5px}.txt{white-space:pre-wrap}.meta{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px}.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}.composer textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:16px;line-height:1.35}.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;flex:none}
.gate{flex:1;display:grid;place-items:center;min-width:0;overflow-y:auto}.gate-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 24px}.mark{font-family:var(--font-display);font-weight:700;color:var(--accent)}.gate-card .mark{font-size:28px;margin-bottom:18px}.gate-card h1{font-size:22px;margin:0 0 8px}.gate-card p{margin:0 0 18px;color:var(--muted)}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;color:var(--muted);font-weight:500}.field input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-size:16px}.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font-weight:600}.secondary{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}.hidden{display:none!important}.notice{font-size:13px;color:var(--muted);margin-top:12px;white-space:pre-wrap}.error{color:#D04444}.hint{padding:14px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="gate" id="gate">
 <div class="gate-card">
  <div class="mark">Kolwer</div>
  <h1 id="gateTitle">Вход по номеру</h1>
  <p id="gateDescription">Введите номер телефона в международном формате, например +79991234567.</p>
  <div id="phoneStep">
   <div class="field"><label for="phone">Номер телефона</label><input id="phone" type="tel" autocomplete="tel" placeholder="+79991234567"></div>
   <div id="recaptcha-container"></div>
   <button class="btn" id="sendCode" style="width:100%">Получить SMS-код</button>
  </div>
  <div id="codeStep" class="hidden">
   <div class="field"><label for="smsCode">Код из SMS</label><input id="smsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
   <button class="btn" id="verifyCode" style="width:100%">Подтвердить номер</button>
   <button class="btn secondary" id="changePhone" style="width:100%;margin-top:8px">Изменить номер</button>
  </div>
  <div id="profileStep" class="hidden">
   <div class="field"><label for="regName">Ваше имя</label><input id="regName" maxlength="20" placeholder="Иван"></div>
   <button class="btn" id="saveProfile" style="width:100%">Продолжить в Kolwer</button>
  </div>
  <div id="gateNotice" class="notice" role="status"></div>
 </div>
</div>
<div class="app hidden" id="app">
 <aside class="side">
  <header class="side-head"><div class="brand">Kolwer</div><button class="btn secondary" id="logout" style="padding:7px 10px">Выйти</button></header>
  <div class="search"><input id="q" type="search" placeholder="Найти пользователя по имени" autocomplete="off"></div>
  <div class="list" id="list"><div class="hint">Введите имя в поиске, чтобы найти пользователя.</div></div>
 </aside>
 <section class="main" id="mainPane">
  <div class="empty" id="empty"><div><div class="mark" style="font-size:36px;margin-bottom:10px">Kolwer</div><div>Найдите пользователя через поиск слева.</div></div></div>
  <div class="conv hidden" id="conv">
   <header class="conv-head"><button class="back" id="back">‹</button><div class="conv-who"><div class="conv-title" id="convTitle"></div></div></header>
   <div class="msgs" id="msgs"></div>
   <form class="composer" id="composer"><textarea id="input" rows="1" placeholder="Сообщение..." maxlength="1000"></textarea><button class="send" type="submit">↑</button></form>
  </div>
 </section>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, RecaptchaVerifier, signInWithPhoneNumber,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, query,
  orderBy, startAt, endAt, limit, getDocs, addDoc,
  serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGKICEmDSoeXUBjBCWCyJuqdk2GAQEv8c",
  authDomain: "colwer.firebaseapp.com",
  projectId: "colwer",
  storageBucket: "colwer.firebasestorage.app",
  messagingSenderId: "985156759901",
  appId: "1:985156759901:web:38bac3f84bae632d9138b4"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);

let confirmation = null;
let recaptcha = null;
let currentUser = null;
let currentChatId = null;
let stopMessages = null;
let searchTimer = null;

function notice(message, isError = false) {
  $("gateNotice").textContent = message;
  $("gateNotice").classList.toggle("error", isError);
}

function showGateStep(step) {
  $("phoneStep").classList.toggle("hidden", step !== "phone");
  $("codeStep").classList.toggle("hidden", step !== "code");
  $("profileStep").classList.toggle("hidden", step !== "profile");
}

function showApp() {
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function showGate() {
  $("app").classList.add("hidden");
  $("gate").classList.remove("hidden");
}

function errorText(error) {
  const messages = {
    "auth/invalid-phone-number": "Проверьте номер телефона.",
    "auth/too-many-requests": "Слишком много попыток. Попробуйте позже.",
    "auth/invalid-verification-code": "Неверный SMS-код.",
    "auth/code-expired": "Срок действия кода истёк. Запросите новый.",
    "auth/captcha-check-failed": "Проверка безопасности не пройдена. Обновите страницу.",
    "auth/network-request-failed": "Проверьте подключение к интернету.",
    "permission-denied": "Нет доступа к Firestore. Проверьте правила базы данных."
  };
  return messages[error.code] || error.message || "Произошла ошибка.";
}

async function setupRecaptcha() {
  if (recaptcha) {
    try { recaptcha.clear(); } catch (_) {}
  }
  recaptcha = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal"
  });
  await recaptcha.render();
}

$("sendCode").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  if (!phone.startsWith("+")) {
    notice("Введите номер в международном формате, начиная с +.", true);
    return;
  }

  $("sendCode").disabled = true;
  notice("Подготавливаем отправку SMS...");

  try {
    await setupRecaptcha();
    confirmation = await signInWithPhoneNumber(auth, phone, recaptcha);
    showGateStep("code");
    notice("SMS-код отправлен на " + phone);
  } catch (error) {
    notice(errorText(error), true);
    try { await setupRecaptcha(); } catch (_) {}
  } finally {
    $("sendCode").disabled = false;
  }
});

$("verifyCode").addEventListener("click", async () => {
  const code = $("smsCode").value.trim();
  if (!confirmation || code.length !== 6) {
    notice("Введите шестизначный код из SMS.", true);
    return;
  }

  $("verifyCode").disabled = true;
  notice("Проверяем код...");

  try {
    await confirmation.confirm(code);
  } catch (error) {
    notice(errorText(error), true);
  } finally {
    $("verifyCode").disabled = false;
  }
});

$("changePhone").addEventListener("click", () => {
  confirmation = null;
  $("smsCode").value = "";
  showGateStep("phone");
  notice("");
});

$("saveProfile").addEventListener("click", async () => {
  const nick = $("regName").value.trim();
  if (nick.length < 2) {
    notice("Введите имя минимум из двух символов.", true);
    return;
  }
  if (!currentUser) return;

  $("saveProfile").disabled = true;
  try {
    await setDoc(doc(db, "profiles", currentUser.uid), {
      uid: currentUser.uid,
      nick,
      nickLower: nick.toLowerCase(),
      createdAt: serverTimestamp()
    });
    showApp();
  } catch (error) {
    notice(errorText(error), true);
  } finally {
    $("saveProfile").disabled = false;
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;

  if (!user) {
    showGate();
    showGateStep("phone");
    return;
  }

  notice("Загружаем профиль...");
  try {
    const profile = await getDoc(doc(db, "profiles", user.uid));
    if (profile.exists()) {
      showApp();
    } else {
      $("gateTitle").textContent = "Создание профиля";
      $("gateDescription").textContent = "Выберите имя, которое увидят другие пользователи.";
      showGate();
      showGateStep("profile");
    }
  } catch (error) {
    showGate();
    notice(errorText(error), true);
  }
});

$("logout").addEventListener("click", async () => {
  if (stopMessages) stopMessages();
  await signOut(auth);
});

$("q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchUsers, 350);
});

async function searchUsers() {
  const term = $("q").value.trim().toLowerCase();
  const list = $("list");

  if (term.length < 2) {
    list.innerHTML = '<div class="hint">Введите минимум две буквы для поиска.</div>';
    return;
  }

  list.innerHTML = '<div class="hint">Ищем пользователей...</div>';

  try {
    const usersQuery = query(
      collection(db, "profiles"),
      orderBy("nickLower"),
      startAt(term),
      endAt(term + "\uf8ff"),
      limit(20)
    );

    const result = await getDocs(usersQuery);
    list.replaceChildren();

    const users = result.docs
      .map(item => item.data())
      .filter(profile => profile.uid !== currentUser.uid);

    if (!users.length) {
      list.innerHTML = '<div class="hint">Пользователи не найдены.</div>';
      return;
    }

    users.forEach(profile => {
      const button = document.createElement("button");
      button.className = "item";

      const body = document.createElement("div");
      body.className = "item-body";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = profile.nick || "Пользователь";

      const preview = document.createElement("div");
      preview.className = "preview";
      preview.textContent = "Начать переписку";

      body.append(title, preview);
      button.append(body);
      button.addEventListener("click", () => openChat(profile));
      list.append(button);
    });
  } catch (error) {
    list.innerHTML = '<div class="hint">Ошибка поиска: ' +
      escapeHTML(errorText(error)) + '</div>';
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function openChat(profile) {
  if (!currentUser || !profile.uid) return;

  const members = [currentUser.uid, profile.uid].sort();
  currentChatId = members.join("_");

  $("convTitle").textContent = profile.nick || "Пользователь";
  $("empty").classList.add("hidden");
  $("conv").classList.remove("hidden");
  $("app").classList.add("in-chat");

  try {
    await setDoc(doc(db, "chats", currentChatId), {
      members,
      updatedAt: serverTimestamp()
    }, { merge: true });

    if (stopMessages) stopMessages();

    const messagesQuery = query(
      collection(db, "chats", currentChatId, "messages"),
      orderBy("createdAt", "asc"),
      limit(200)
    );

    stopMessages = onSnapshot(messagesQuery, snapshot => {
      const messages = $("msgs");
      messages.replaceChildren();

      snapshot.forEach(messageDoc => {
        const message = messageDoc.data();
        const row = document.createElement("div");
        row.className = "row " +
          (message.sender === currentUser.uid ? "mine" : "their");

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        const text = document.createElement("div");
        text.className = "txt";
        text.textContent = message.text || "";

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = message.createdAt?.toDate
          ? message.createdAt.toDate().toLocaleTimeString("ru-RU", {
              hour: "2-digit",
              minute: "2-digit"
            })
          : "";

        bubble.append(text, meta);
        row.append(bubble);
        messages.append(row);
      });

      messages.scrollTop = messages.scrollHeight;
    }, error => {
      $("msgs").textContent = errorText(error);
    });
  } catch (error) {
    $("msgs").textContent = errorText(error);
  }
}

$("back").addEventListener("click", () => {
  $("app").classList.remove("in-chat");
  $("conv").classList.add("hidden");
  $("empty").classList.remove("hidden");
  if (stopMessages) {
    stopMessages();
    stopMessages = null;
  }
  currentChatId = null;
});

$("composer").addEventListener("submit", async event => {
  event.preventDefault();

  const text = $("input").value.trim();
  if (!text || !currentChatId || !currentUser) return;

  $("input").value = "";

  try {
    await addDoc(
      collection(db, "chats", currentChatId, "messages"),
      {
        text,
        sender: currentUser.uid,
        createdAt: serverTimestamp()
      }
    );

    await setDoc(doc(db, "chats", currentChatId), {
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch (error) {
    $("msgs").textContent = errorText(error);
    $("input").value = text;
  }
});
</script>
</body>
</html>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,startAt,endAt,limit,onSnapshot,addDoc,serverTimestamp,runTransaction,getDocs,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,deleteUser} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyAGKICEmDSoeXUBjBCWCyJuqdk2GAQEv8c",
 authDomain:"colwer.firebaseapp.com",
 projectId:"colwer",
 storageBucket:"colwer.firebasestorage.app",
 messagingSenderId:"985156759901",
 appId:"1:985156759901:web:38bac3f84bae632d9138b4"
};

const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
const auth=getAuth(firebaseApp);
const $=id=>document.getElementById(id);

let currentUser=null;
let currentChatId=null;
let unsubMsgs=null;
let unsubChats=null;
let searchTimer=null;
let searchToken=0;
let activeTab="chats";
let registrationInProgress=false;

const friendlyError=e=>{
 const c=e?.code||'';
 const map={
  'auth/email-already-in-use':'Эта почта уже зарегистрирована. Войдите в аккаунт.',
  'auth/invalid-email':'Проверьте адрес электронной почты.',
  'auth/weak-password':'Пароль должен содержать минимум 6 символов.',
  'auth/user-not-found':'Аккаунт с такой почтой не найден.',
  'auth/wrong-password':'Неверная почта или пароль.',
  'auth/invalid-credential':'Неверная почта или пароль.',
  'auth/too-many-requests':'Слишком много попыток. Попробуйте позже.',
  'auth/unauthorized-domain':'Добавьте домен сайта в Firebase Authentication → Settings → Authorized domains.',
  'permission-denied':'Firestore отклонил запрос. Проверьте правила базы данных.',
  'auth/network-request-failed':'Проверьте подключение к интернету.',
  'username-taken':'Этот юзернейм уже занят. Придумайте другой.'
 };
 return map[c]||e?.message||'Не удалось выполнить действие. Проверьте настройки Firebase.';
};

function showError(e){
 console.error(e);
 $('gateNotice').textContent=friendlyError(e);
 $('gateNotice').className='notice error';
}

function gateMode(mode){
 const register=mode==='register';
 $('registerStep').classList.toggle('hidden',!register);
 $('loginStep').classList.toggle('hidden',register);
 $('gateTitle').textContent=register?'Создать аккаунт':'Вход в Kolwer';
 $('gateDescription').textContent=register
  ?'Регистрация без SMS: укажите номер телефона, почту и придумайте юзернейм.'
  :'Войдите по электронной почте и паролю.';
 $('gateNotice').textContent='';
 $('gateNotice').className='notice';
}

function showApp(){
 $('gate').classList.add('hidden');
 $('app').classList.remove('hidden');
}

function showGate(){
 $('app').classList.add('hidden');
 $('gate').classList.remove('hidden');
}

onAuthStateChanged(auth,async user=>{
 currentUser=user;

 if(!user){
  showGate();
  gateMode('register');
  return;
 }

 try{
  const p=await getDoc(doc(db,'profiles',user.uid));

  if(p.exists()){
   showApp();
   $('myProfile').textContent=(p.data().nick||'Мой профиль')+(p.data().username?' · @'+p.data().username:'');
   loadChats();
  }else if(!registrationInProgress){
   await signOut(auth);
   showGate();
   gateMode('register');
  }
 }catch(e){
  showGate();
  showError(e);
 }
});

$('showLogin').onclick=()=>gateMode('login');
$('showRegister').onclick=()=>gateMode('register');

$('registerBtn').onclick=async()=>{
 const nick=$('regName').value.trim();
 const username=$('regUsername').value.trim().replace(/^@/,'').toLowerCase();
 const phone=$('regPhone').value.trim();
 const email=$('regEmail').value.trim();
 const password=$('regPassword').value;

 if(nick.length<2){
  $('gateNotice').textContent='Имя должно содержать минимум 2 символа.';
  return;
 }

 if(!/^[a-z0-9_]{3,20}$/.test(username)){
  $('gateNotice').textContent='Юзернейм: 3–20 символов, только латинские буквы, цифры и _.';
  return;
 }

 if(!/^\+[1-9]\d{7,14}$/.test(phone)){
  $('gateNotice').textContent='Введите номер в международном формате, например +447700900123.';
  return;
 }

 if(!email||password.length<6){
  $('gateNotice').textContent='Введите корректную почту и пароль минимум из 6 символов.';
  return;
 }

 let credential=null;

 try{
  $('registerBtn').disabled=true;
  registrationInProgress=true;

  credential=await createUserWithEmailAndPassword(auth,email,password);

  const uid=credential.user.uid;
  const profileRef=doc(db,'profiles',uid);
  const usernameRef=doc(db,'usernames',username);

  await runTransaction(db,async tx=>{
   const existing=await tx.get(usernameRef);

   if(existing.exists()){
    const err=new Error('username-taken');
    err.code='username-taken';
    throw err;
   }

   tx.set(usernameRef,{
    uid,
    username,
    createdAt:serverTimestamp()
   });

   tx.set(profileRef,{
    nick,
    nickLower:nick.toLocaleLowerCase(),
    username,
    usernameLower:username,
    phone,
    email,
    createdAt:serverTimestamp()
   });
  });

  $('myProfile').textContent=nick+' · @'+username;
  showApp();
  loadChats();

 }catch(e){
  if(credential?.user){
   try{
    await deleteUser(credential.user);
   }catch(deleteError){
    console.error(deleteError);
   }
  }

  showError(e);

  if(e?.code==='username-taken'){
   $('gateNotice').textContent='Этот юзернейм уже занят. Придумайте другой.';
  }

 }finally{
  registrationInProgress=false;
  $('registerBtn').disabled=false;
 }
};

$('loginBtn').onclick=async()=>{
 const email=$('loginEmail').value.trim();
 const password=$('loginPassword').value;

 if(!email||!password){
  $('gateNotice').textContent='Введите почту и пароль.';
  return;
 }

 try{
  $('loginBtn').disabled=true;
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  showError(e);
 }finally{
  $('loginBtn').disabled=false;
 }
};

$('logout').onclick=async()=>{
 if(unsubMsgs){
  unsubMsgs();
  unsubMsgs=null;
 }

 if(unsubChats){
  unsubChats();
  unsubChats=null;
 }

 await signOut(auth);
};

$('chatsTab').onclick=()=>switchTab('chats');
$('searchTab').onclick=()=>switchTab('search');

function switchTab(tab){
 activeTab=tab;

 $('chatsTab').classList.toggle('active',tab==='chats');
 $('searchTab').classList.toggle('active',tab==='search');
 $('searchWrap').classList.toggle('hidden',tab!=='search');

 if(tab==='chats'){
  $('q').value='';
  loadChats();
 }else{
  $('list').innerHTML='<div class="hint">Введите минимум 2 символа имени для поиска.</div>';
  $('q').focus();
 }
}

function loadChats(){
 if(!currentUser||activeTab!=='chats')return;

 if(unsubChats)unsubChats();

 $('list').innerHTML='<div class="hint">Загружаем чаты…</div>';

 const qChats=query(
  collection(db,'chats'),
  where('members','array-contains',currentUser.uid)
 );

 unsubChats=onSnapshot(qChats,async snap=>{
  const entries=[];

  for(const d of snap.docs){
   const data=d.data();
   const other=(data.members||[]).find(x=>x!==currentUser.uid);

   if(!other)continue;

   let nick='Пользователь';

   try{
    const prof=await getDoc(doc(db,'profiles',other));
    if(prof.exists())nick=prof.data().nick||nick;
   }catch{}

   entries.push({
    id:d.id,
    other,
    nick,
    last:data.lastMessage||'Нажмите, чтобы открыть чат',
    time:data.updatedAt?.toDate?data.updatedAt.toDate().getTime():0
   });
  }

  entries.sort((a,b)=>b.time-a.time);

  if(activeTab!=='chats')return;

  const list=$('list');
  list.innerHTML='';

  if(!entries.length){
   list.innerHTML='<div class="empty"><div>Пока нет переписок.<br><br>Нажмите «Найти», чтобы начать общение.</div></div>';
   return;
  }

  for(const item of entries){
   const b=document.createElement('button');
   b.className='item';

   const body=document.createElement('div');
   body.className='item-body';

   const top=document.createElement('div');
   top.className='item-top';

   const title=document.createElement('div');
   title.className='title';
   title.textContent=item.nick;

   top.append(title);

   const bot=document.createElement('div');
   bot.className='item-bot';

   const preview=document.createElement('div');
   preview.className='preview';
   preview.textContent=item.last;

   bot.append(preview);
   body.append(top,bot);
   b.append(body);

   b.onclick=()=>openChat(item.other,item.nick);
   list.append(b);
  }

 },e=>{
  $('list').innerHTML='<div class="hint error">'+friendlyError(e)+'</div>';
 });
}

$('q').addEventListener('input',()=>{
 if(activeTab!=='search')return;

 clearTimeout(searchTimer);

 const term=$('q').value.trim().toLocaleLowerCase();

 if(term.length<2){
  $('list').innerHTML='<div class="hint">Введите минимум 2 символа для поиска.</div>';
  return;
 }

 searchTimer=setTimeout(()=>searchUsers(term),350);
});

async function searchUsers(term){
 const token=++searchToken;

 $('list').innerHTML='<div class="hint">Ищем...</div>';

 try{
  const [byName,byUsername]=await Promise.all([
   getDocs(query(
    collection(db,'profiles'),
    orderBy('nickLower'),
    startAt(term),
    endAt(term+'\uf8ff'),
    limit(20)
   )),
   getDocs(query(
    collection(db,'profiles'),
    orderBy('usernameLower'),
    startAt(term.replace(/^@/,'')),
    endAt(term.replace(/^@/,'')+'\uf8ff'),
    limit(20)
   ))
  ]);

  if(token!==searchToken)return;

  const found=new Map();

  for(const snap of [byName,byUsername]){
   snap.forEach(d=>{
    if(d.id!==currentUser.uid){
     found.set(d.id,{id:d.id,...d.data()});
    }
   });
  }

  const list=$('list');
  list.innerHTML='';

  if(!found.size){
   list.innerHTML='<div class="hint">Пользователи не найдены.</div>';
   return;
  }

  for(const item of found.values()){
   const name=item.nick||'Пользователь';

   const b=document.createElement('button');
   b.className='item';

   const body=document.createElement('div');
   body.className='item-body';

   const top=document.createElement('div');
   top.className='item-top';

   const title=document.createElement('div');
   title.className='title';
   title.textContent=name;

   top.append(title);

   const bot=document.createElement('div');
   bot.className='item-bot';

   const preview=document.createElement('div');
   preview.className='preview';
   preview.textContent='@'+(item.username||'')+' · Начать чат';

   bot.append(preview);
   body.append(top,bot);
   b.append(body);

   b.onclick=()=>openChat(item.id,name);
   list.append(b);
  }

 }catch(e){
  $('list').innerHTML='<div class="hint error">'+friendlyError(e)+'</div>';
 }
}

async function openChat(uid,name){
 if(!currentUser)return;

 const members=[currentUser.uid,uid].sort();
 currentChatId=members.join('_');

 try{
  const chatRef=doc(db,'chats',currentChatId);

  await runTransaction(db,async tx=>{
   const snap=await tx.get(chatRef);

   if(!snap.exists()){
    tx.set(chatRef,{
     members,
     createdAt:serverTimestamp()
    });
   }
  });

  $('conv').classList.remove('hidden');
  $('empty').classList.add('hidden');
  $('convTitle').textContent=name;
  $('app').classList.add('in-chat');

  if(unsubMsgs)unsubMsgs();

  const messagesQuery=query(
   collection(db,'chats',currentChatId,'messages'),
   orderBy('createdAt','asc'),
   limit(100)
  );

  unsubMsgs=onSnapshot(messagesQuery,snap=>{
   const box=$('msgs');
   box.innerHTML='';

   snap.forEach(d=>{
    const msg=d.data();

    const row=document.createElement('div');
    row.className='row '+(msg.sender===currentUser.uid?'mine':'their');

    const bubble=document.createElement('div');
    bubble.className='bubble';

    const txt=document.createElement('div');
    txt.className='txt';
    txt.textContent=msg.text||'';

    const meta=document.createElement('span');
    meta.className='meta';
    meta.textContent=msg.createdAt?.toDate
     ?msg.createdAt.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
     :'';

    bubble.append(txt,meta);
    row.append(bubble);
    box.append(row);
   });

   box.scrollTop=box.scrollHeight;

  },e=>alert(friendlyError(e)));

 }catch(e){
  alert(friendlyError(e));
 }
}

$('back').onclick=()=>{
 $('app').classList.remove('in-chat');
};

$('composer').onsubmit=async e=>{
 e.preventDefault();

 const text=$('input').value.trim();

 if(!text||!currentChatId||!currentUser)return;

 const send=$('composer').querySelector('button');
 send.disabled=true;

 try{
  await addDoc(
   collection(db,'chats',currentChatId,'messages'),
   {
    text,
    sender:currentUser.uid,
    createdAt:serverTimestamp()
   }
  );

  $('input').value='';

 }catch(err){
  alert(friendlyError(err));
 }finally{
  send.disabled=false;
 }
};
</script>
